<form method="post" action="/settings/baserow-writes" class="baserow-switch d-inline-flex align-items-center">
  <input type="hidden" name="back" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
  <div class="form-check form-switch mb-0" title="Off: runs only log their Baserow rows. On: runs write to the live media table. Approving a review always writes.">
    <input class="form-check-input" type="checkbox" role="switch" id="baserow-switch-{{ switch_id | default('main') }}" name="enabled"
           {% if baserow_on %}checked{% endif %}
           onchange="if (this.checked && !confirm('Write to the live Baserow media table from now on?')) { this.checked = false; return; } this.form.submit();">
    <label class="form-check-label small" for="baserow-switch-{{ switch_id | default('main') }}">
      <i class="fa-solid fa-database me-1"></i>Baserow writes:
      {% if baserow_on %}<strong class="text-danger">ON</strong>{% else %}<strong>off</strong>{% endif %}
    </label>
  </div>
</form>
