{# Header bars: CPU, GPU, memory and temperature, green below 60%, orange below 85%, red above. #}
{% for bar in bars %}
<div class="mam-res" title="{{ bar.label }}: {{ bar.value }}{{ bar.unit }}">
  {% if bar.icon %}<i class="fa-solid {{ bar.icon }} mam-res-mark"></i>{% else %}<span class="mam-res-mark mam-res-letter">{{ bar.letter }}</span>{% endif %}
  <div class="progress" role="progressbar" aria-label="{{ bar.label }}" aria-valuenow="{{ bar.value }}" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar bg-{{ bar.color }}" style="width: {{ bar.width }}%"></div>
  </div>
  <span class="mam-res-value">{{ bar.value }}{{ bar.unit }}</span>
</div>
{% endfor %}
