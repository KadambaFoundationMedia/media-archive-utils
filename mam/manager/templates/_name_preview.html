<div class="font-monospace fs-6 text-break">{{ r.name }}</div>
<div class="small text-body-secondary">Folder: {% if r.category %}<span class="badge cat-pill" style="{{ category_style(r.category) }}">{{ r.category }}</span>{% else %}_unresolved{% endif %}</div>
{% if r.problems %}
<ul class="small text-danger mb-0">{% for pr in r.problems %}<li>{{ pr }}</li>{% endfor %}</ul>
{% else %}<div class="small text-success"><i class="fa-solid fa-check me-1"></i>Follows the naming convention</div>{% endif %}
