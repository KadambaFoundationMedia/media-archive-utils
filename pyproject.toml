[project]
name = "media-archive-utils"
dynamic = ["version"]
description = "Tools for renaming and processing the Kadamba Kanana Swami media archive"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "xxhash>=3.4",
    "pyyaml>=6.0",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "mutagen>=1.48.1",
    "pycountry>=26.2.16",
    "mlx-whisper>=0.4.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
mam = "mam.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mam/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real media processing on trimming-samples/ (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mam/helpers/local_db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported into test modules and then used as parameters
"tests/*" = ["F811"]
