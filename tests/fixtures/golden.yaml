# Golden fixtures: the documented examples from the tool specs, used to test and calibrate tools.
# Times are in seconds. Tolerance for split/trim boundaries: tolerance_s (SPEC.md section 9).
# Expected names follow SPEC.md section 3 (unknown segments omitted, ccTLD corrected); the
# name written in the tool spec is kept as spec_name where it differs.
tolerance_s: 1.5

